name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run test

  review_gate:
    if: github.event_name == 'pull_request' && vars.AI_REVIEW_GATE_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Require trusted AI review scorecard input
        env:
          AI_REVIEW_SCORECARD_JSON: ${{ env.AI_REVIEW_SCORECARD_JSON }}
        run: |
          if [ -z "${AI_REVIEW_SCORECARD_JSON}" ]; then
            echo "AI_REVIEW_SCORECARD_JSON is required when AI_REVIEW_GATE_ENABLED=true."
            echo "Populate it from trusted upstream review automation before enabling this gate."
            exit 1
          fi

      - name: Write AI review scorecard
        env:
          AI_REVIEW_SCORECARD_JSON: ${{ env.AI_REVIEW_SCORECARD_JSON }}
        run: |
          mkdir -p .ai-review
          printf '%s' "$AI_REVIEW_SCORECARD_JSON" > .ai-review/scorecard.json

      - name: Evaluate AI review gate
        id: gate
        run: bun run scripts/ai-review-gate.ts --input .ai-review/scorecard.json

      - name: Explain auto-approval prerequisites
        if: steps.gate.outputs.auto_approve == 'true' && vars.AI_REVIEW_AUTO_APPROVE_ENABLED != 'true'
        run: |
          printf '%s\n' 'Auto-approval eligibility detected, but AI_REVIEW_AUTO_APPROVE_ENABLED is not true.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'The gate passed via status check only. Enable bot approvals separately if you want approval automation.' >> "$GITHUB_STEP_SUMMARY"

      - name: Auto-approve eligible PR
        id: auto_approve
        if: steps.gate.outputs.auto_approve == 'true' && vars.AI_REVIEW_AUTO_APPROVE_ENABLED == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review --approve "$PR_URL" --body "AI review gate marked this PR auto-approve eligible."

      - name: Record auto-approval failure
        if: steps.auto_approve.outcome == 'failure'
        run: |
          printf '%s\n' 'Bot approval failed. Check repository settings that allow GitHub Actions to approve pull requests.' >> "$GITHUB_STEP_SUMMARY"
